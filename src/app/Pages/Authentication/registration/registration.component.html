<div class="registration-form">
  <h2>Patient Registration</h2>
  <form [formGroup]="registrationForm" (ngSubmit)="onSubmit()" autocomplete="off">


    <label>First Name: *</label>
    <input formControlName="firstName" type="text" />
    <div *ngIf="registrationForm.get('firstName')?.touched && registrationForm.get('firstName')?.invalid" class="error">
      First Name is required.
    </div>

    <label>Last Name: *</label>
    <input formControlName="lastName" type="text" />
    <div *ngIf="registrationForm.get('lastName')?.touched && registrationForm.get('lastName')?.invalid" class="error">
      Last Name is required.
    </div>
    
    <label>Email: *</label>
<input formControlName="email" type="email" />
<div *ngIf="registrationForm.get('email')?.touched && registrationForm.get('email')?.invalid" class="error">
  Email is required.
</div>


    <label>Phone: *</label>
    <input formControlName="phone" type="tel" />
    <div *ngIf="registrationForm.get('phone')?.touched && registrationForm.get('phone')?.invalid" class="error">
      Phone is required.
    </div>

    <label>Date of Birth: *</label>
    <input formControlName="dob" type="date" />
    <div *ngIf="registrationForm.get('dob')?.touched && registrationForm.get('dob')?.invalid" class="error">
      Date of Birth is required.
    </div>

    <label>Gender: *</label>
    <select formControlName="gender">
      <option value="">Select</option>
      <option value="Male">Male</option>
      <option value="Female">Female</option>
      <option value="Other">Other</option>
    </select>
    <div *ngIf="registrationForm.get('gender')?.touched && registrationForm.get('gender')?.invalid" class="error">
      Gender is required.
    </div>

    <label>Blood Group: *</label>
    <select formControlName="bloodGroup">
  <option value="">Select</option>
  <option value="A+">A+</option>
  <option value="A-">A-</option>
  <option value="B+">B+</option>
  <option value="B-">B-</option>
  <option value="AB+">AB+</option>
  <option value="AB-">AB-</option>
  <option value="O+">O+</option>
  <option value="O-">O-</option>
</select>
    <div *ngIf="registrationForm.get('bloodGroup')?.touched && registrationForm.get('bloodGroup')?.invalid" class="error">
      Blood Group is required.
    </div>

    <label>City/State: *</label>
    <input formControlName="cityState" type="text" />
    <div *ngIf="registrationForm.get('cityState')?.touched && registrationForm.get('cityState')?.invalid" class="error">
      City/State is required.
    </div>

    <label>Emergency Contact: *</label>
    <input formControlName="emergencyContact" type="tel" />
    <div *ngIf="registrationForm.get('emergencyContact')?.touched && registrationForm.get('emergencyContact')?.invalid" class="error">
      Emergency Contact is required.
    </div>

    <label>Address: *</label>
    <textarea formControlName="address"></textarea>
    <div *ngIf="registrationForm.get('address')?.touched && registrationForm.get('address')?.invalid" class="error">
      Address is required.
    </div>

    <button type="submit">Submit</button>
  </form>
</div>
